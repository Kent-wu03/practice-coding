<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2 -- responsive design</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
    <div class="container">
        <div class="wrapper">
            <div class="card text-center">
                <h1 class="title">Youtube</h1>
                <i class="fa-brands fa-youtube icons"></i>
                <p class="description">RockyBandel Channel</p>
                <button class="btn">Follow</button>
            </div>
            <div class="card text-center">
                <h1 class="title">Twitter</h1>
                <i class="fa-brands fa-twitter icons"></i>
                <p class="description">RockyBandel Twitter</p>
                <button class="btn">Follow</button>
            </div>
            <div class="card text-center">
                <h1 class="title">Google</h1>
                <i class="fa-brands fa-google icons"></i>
                <p class="description">RockyBandel Email</p>
                <button class="btn">Follow</button>
            </div>
            <div class="card text-center">
                <h1 class="title">Facebook</h1>
                <i class="fa-brands fa-facebook icons"></i>
                <p class="description">RockyBandel Facebook</p>
                <button class="btn">Follow</button>
            </div>
        </div>
    </div>
    <div class="container2">
        <div class="card text-center">
                <h1 class="title">Diffrent</h1>
                <p class="description">Beda Resolusi</p>
                <button class="btn">LOL</button>
        </div>
    </div>
</body>
</html>
